<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tous nos produits - MonShop</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">MonShop</a>
            <nav class="nav-links">
                <a href="/product-list.html">Produits</a>
                <a href="/templates/cart.html" class="nav-link">
                    Panier <span class="cart-count">0</span>
                </a>
                <a href="/templates/login.html" class="login-btn">Connexion</a>
            </nav>
        </div>
    </header>

    <main class="app">
        <section class="product-list-container">
            <h1>Tous nos produits</h1>
            <div class="filters">
                <select id="category-filter">
                    <option value="">Toutes catégories</option>
                    <option value="electronics">Électronique</option>
                    <option value="clothing">Vêtements</option>
                    <option value="home">Maison</option>
                </select>
                <select id="sort-by">
                    <option value="price-asc">Prix croissant</option>
                    <option value="price-desc">Prix décroissant</option>
                    <option value="name-asc">Nom (A-Z)</option>
                </select>
            </div>
            <div class="products-grid" id="all-products">
                <!-- Les produits seront chargés via JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 MonShop. Tous droits réservés.</p>
    </footer>

    <script src="../scripts/api.js"></script>
    <script src="../scripts/auth.js"></script>
    <script src="../scripts/cart.js"></script>
    <script src="../scripts/products.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            
            // Gérer les filtres
            document.getElementById('category-filter').addEventListener('change', loadProducts);
            document.getElementById('sort-by').addEventListener('change', loadProducts);
            
            // Mettre à jour le compteur du panier
            updateCartCount();
        });
    </script>
</body>
</html>
